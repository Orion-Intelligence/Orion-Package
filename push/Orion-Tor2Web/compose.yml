services:
  tor2web:
    image: ${ORION_PACKAGE_IMAGE:?Select the Tor2Web image}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${HTTPS_PORT:-443}:443"
    environment:
      BASEHOST: ${BASEHOST:-tor.orionintelligence.org}
      LETSENCRYPT_CERT_NAME: ${LETSENCRYPT_CERT_NAME:-onion-tor-orionintelligence-org}
      T2W_PROCESSES: ${T2W_PROCESSES:-2}
    volumes:
      - type: bind
        source: ${LETSENCRYPT_DIR:-/etc/letsencrypt}
        target: /etc/letsencrypt
        read_only: true
        bind:
          create_host_path: false
      - tor:/var/lib/tor
      - gateway:/var/lib/tor2web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  tor:
  gateway:
